:root{--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;--space:clamp(22px,5.2vw,112px)}
*{box-sizing:border-box}
body{margin:0;-webkit-font-smoothing:antialiased;font-family:var(--sans);text-rendering:optimizeLegibility}
.wordmark{width:clamp(151px,14vw,253px);height:auto;display:block}
h1,p{margin:0}
footer{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px 32px;padding:21px var(--space);font-size:clamp(11px,.92vw,16px);line-height:1.5}
.company{color:inherit;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;min-height:44px}
.company:hover{text-decoration:underline;text-underline-offset:4px}
.company:focus-visible{outline:2px solid currentColor;outline-offset:5px}
address{font-style:normal}
address i{font-style:normal;padding-inline:.3em}
@media(max-width:760px){footer{flex-wrap:wrap;justify-content:flex-start;gap:3px 15px;padding-block:17px 20px}.company{min-height:24px;width:100%;margin:0 0 4px}address{font-size:11px}address i{padding-inline:.08em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{color-scheme:dark;--ink:#fffaf2}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:#092c38;color:var(--ink)}
.hero{position:relative;isolation:isolate;flex:1;min-height:clamp(520px,43vw,730px);background:#22365b;overflow:hidden}
.landscape{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 55%;z-index:-3}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(105deg,rgba(15,31,63,.35),rgba(19,34,62,.14) 43%,transparent 68%)}
.top{padding:clamp(28px,4.1vh,52px) var(--space) 0}
.wordmark{width:clamp(155px,14.4vw,254px)}
.copy{padding:clamp(52px,8.8vh,112px) var(--space) clamp(180px,19vh,280px)}
h1{font-size:clamp(48px,5.05vw,98px);line-height:1.03;letter-spacing:-.057em;font-weight:500}
h1 .line,h1 em{display:block}
h1 em{font:italic 400 1em/1.05 var(--serif);letter-spacing:-.056em;color:#ffe5cc}
.made{margin-top:clamp(18px,2.6vh,32px);font-size:clamp(15px,1.15vw,20px);line-height:1.45;color:#fff9ee;letter-spacing:-.012em}
footer{background:#092c38;color:#d4e0de}
.company{color:#fff9ef}
@media(max-width:760px){
 .hero{min-height:510px}.top{padding-top:26px}.wordmark{width:154px}
 .copy{padding-top:clamp(44px,6.8vh,70px);padding-bottom:220px}
 h1{font-size:clamp(42px,7.1vw,55px)}
 .landscape{object-position:64% 55%}
 .hero::before{background:linear-gradient(145deg,rgba(15,29,55,.48),rgba(17,32,55,.22) 43%,transparent 70%)}
 .made{font-size:15px;max-width:37ch}
}

 .hero{min-height:550px}.top{padding-top:24px}
